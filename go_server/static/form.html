<!DOCTYPE html>
<html>
<head>
    <title>Go Form</title>
    <style>
        body {
            font-family: Arial;
            background: #eef2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        input, textarea, button {
            width: 100%;
            margin-top: 10px;
            padding: 8px;
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }
    </style>
</head>

<body>
<div class="box">
    <h2>Submit Form</h2>

    <form method="POST" action="/form">
        <input type="text" name="name" placeholder="Enter Name" required>
        <textarea name="address" placeholder="Enter Address" rows="3" required></textarea>
        <button type="submit">Submit</button>
    </form>
</div>
</body>
</html>
