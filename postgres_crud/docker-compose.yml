version: '3.8'

services:
  database:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: exampledb

  adminer:
    image: adminer
    restart: always
    depends_on:
      - database
    ports:
      - "8080:8080"

  app:
    build: .
    ports:
      - "6000:6000"
    restart: on-failure
    depends_on:
      - database
    environment:
      POSTGRES_URL: "postgres://docker:docker@database:5432/exampledb?sslmode=disable"
